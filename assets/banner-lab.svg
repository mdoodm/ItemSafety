<title id="t">ItemSafety</title>
<desc id="d">A Schedule I cauldron with four leaf slots, a petrol slot and its output, next to a handler's pocket holding 20 coca leaves the base game would have deleted. Log lines show the delivery kept and the carried items restored after loading. Alpha test build.</desc>
